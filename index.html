<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Wolf Solver</title>
<style>img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Sea Wolf Solver</title>
<style>
  :root{
    --bg:#f4f6f7; --card:#fff; --line:#dde3e5; --ink:#132227; --soft:#5f747b;
    --accent:#0c7a8a; --good:#0b8a5b; --goodbg:#e3f4ec; --bad:#cf3d24; --badbg:#fbe7e1;
    --warn:#9a6a06;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0a1519; --card:#10262c; --line:#22424a; --ink:#e7f1f2; --soft:#8fa8ae;
    --accent:#2bb1c2; --good:#33bc88; --goodbg:#0f3329; --bad:#f1725b; --badbg:#37201c; --warn:#e0a63c;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
  .sub{color:var(--soft);font-size:13px;margin:0 0 20px}
  h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:22px 0 8px;font-weight:600}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}

  table{border-collapse:collapse;width:100%}
  th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);font-weight:600;text-align:left;padding:4px 6px}
  th.c,td.c{text-align:center}
  td{padding:3px 6px;border-top:1px solid var(--line)}
  tbody tr:first-child td{border-top:none}
  input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
  input.n{text-align:center;width:56px;font-family:ui-monospace,monospace}
  th input{border:none;background:transparent;padding:2px;font:inherit;font-weight:600;color:var(--ink);text-align:center}
  th input:focus{box-shadow:none}
  select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
  .x{border:none;background:none;color:var(--soft);cursor:pointer;font-size:17px;line-height:1;padding:2px 6px;border-radius:5px}
  .x:hover{color:var(--bad);background:var(--badbg)}
  .add{border:1px dashed var(--line);background:none;color:var(--accent);cursor:pointer;
    border-radius:7px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;margin-top:10px}
  .add:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}

  .rng{display:flex;flex-wrap:wrap;gap:12px}
  .rng .f{display:flex;align-items:center;gap:6px;font-size:13px}
  .rng .f b{min-width:auto}
  .rng .f input{width:48px}
  .traits{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
  .traits .f{flex:1;min-width:150px}
  .traits label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:4px;font-weight:600}
  .pick{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--soft)}

  .status{font-size:13px;color:var(--soft);margin:0 0 10px}
  .status .ok{color:var(--good);font-weight:600}
  .status .no{color:var(--bad);font-weight:600}

  .sol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .sol.best{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
  .sol .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .sol .rank{font-size:12px;color:var(--soft);font-family:ui-monospace,monospace}
  .sol .pct{margin-left:auto;font-weight:700;font-family:ui-monospace,monospace;font-size:15px}
  .names{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .nm{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .nm.g{background:var(--goodbg);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
  .nm.b{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
  .nm small{color:var(--soft);margin-left:4px}
  .checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
  .checks span{display:inline-flex;align-items:center;gap:5px}
  .checks .v{font-family:ui-monospace,monospace;font-weight:600}
  .ck{color:var(--good)} .cx{color:var(--bad)}
  .empty{color:var(--soft);padding:14px 0}
  a.clear{color:var(--accent);cursor:pointer;font-size:13px;font-weight:600}
  a.clear:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="wrap">
  <h1>Sea Wolf Solver</h1>
  <p class="sub">Enter the pool + target. It ranks every treatment. <a class="clear" id="clear">clear</a></p>

  <h2>Target</h2>
  <div class="card">
    <div class="rng" id="rng"></div>
    <div class="traits">
      <div class="f"><label for="des">Desired trait (need &ge;1)</label><select id="des"></select></div>
      <div class="f"><label for="und">Undesired trait (allow 0)</label><select id="und"></select></div>
    </div>
    <div class="pick"><label for="pick">Pick</label><input class="n" id="pick" type="number" min="1" max="6" value="3"><span>microbes</span></div>
  </div>

  <h2>Microbes</h2>
  <div class="card">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <button class="add" id="addRow">+ microbe</button>
    <button class="add" id="addCol">+ attribute</button>
  </div>

  <h2>Best treatments</h2>
  <p class="status" id="status"></p>
  <div id="out"></div>
</div>

<script>
(function(){
  "use strict";
  var uid=0, gid=function(){return "k"+(++uid);};
  var norm=function(s){return (s||"").trim().toLowerCase();};
  var $=function(s){return document.querySelector(s);};
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function find(a,k){for(var i=0;i<a.length;i++)if(a[i].id===k)return a[i];return null;}
  function fmt(x){return (Math.round(x*100)/100).toString();}

  function sample(){
    var a=[{id:gid(),name:"Size"},{id:gid(),name:"Energy"},{id:gid(),name:"Mobility"}];
    function m(n,t,v){var o={id:gid(),name:n,trait:t,vals:{}};o.vals[a[0].id]=v[0];o.vals[a[1].id]=v[1];o.vals[a[2].id]=v[2];return o;}
    var mic=[m("Azure","Coral",[1,4,8]),m("Verdant","Kelp",[2,6,9]),m("Basalt","Reef",[3,5,7]),
      m("Drift","Plankton",[2,7,6]),m("Saline","Brine",[1,5,9]),m("Coralline","Coral",[4,3,8]),
      m("Nimbus","Kelp",[3,6,8]),m("Tidal","Reef",[5,4,5]),m("Murk","Brine",[2,8,7]),m("Pelagic","Plankton",[1,5,9])];
    var r={};r[a[0].id]={min:1,max:3};r[a[1].id]={min:4,max:6};r[a[2].id]={min:7,max:9};
    return {attrs:a,microbes:mic,ranges:r,des:"Coral",und:"Brine",pick:3};
  }
  function blank(){
    var a=[{id:gid(),name:"Size"},{id:gid(),name:"Energy"},{id:gid(),name:"Mobility"}];
    var mic=[];for(var i=0;i<10;i++){var o={id:gid(),name:"",trait:"",vals:{}};a.forEach(function(x){o.vals[x.id]="";});mic.push(o);}
    var r={};a.forEach(function(x){r[x.id]={min:"",max:""};});
    return {attrs:a,microbes:mic,ranges:r,des:"",und:"",pick:3};
  }

  var S;
  try{var sv=localStorage.getItem("seawolf.min");if(sv){S=JSON.parse(sv);uid=0;}}catch(e){}
  if(!S)S=sample();
  function save(){try{localStorage.setItem("seawolf.min",JSON.stringify(S));}catch(e){}}

  function traits(){var seen=[],out=[];S.microbes.forEach(function(m){var t=(m.trait||"").trim();if(t&&seen.indexOf(norm(t))<0){seen.push(norm(t));out.push(t);}});return out;}

  /* ----- render table ----- */
  function renderTable(){
    var th=$("#thead");th.innerHTML="";
    var tr=el("tr");
    tr.appendChild(el("th",null,"Microbe"));
    tr.appendChild(el("th",null,"Trait"));
    S.attrs.forEach(function(a){
      var h=el("th","c");
      var i=el("input");i.value=a.name;i.dataset.aid=a.id;i.dataset.k="aname";i.setAttribute("aria-label","attribute name");
      h.appendChild(i);
      if(S.attrs.length>1){var x=el("button","x","&times;");x.dataset.delcol=a.id;x.title="remove";h.appendChild(x);}
      tr.appendChild(h);
    });
    tr.appendChild(el("th",null,""));
    th.appendChild(tr);

    var tb=$("#tbody");tb.innerHTML="";
    S.microbes.forEach(function(m){
      var row=el("tr");
      var nc=el("td");var ni=el("input");ni.value=m.name;ni.placeholder="name";ni.dataset.mid=m.id;ni.dataset.k="name";nc.appendChild(ni);row.appendChild(nc);
      var tc=el("td");var ti=el("input");ti.value=m.trait;ti.placeholder="trait";ti.dataset.mid=m.id;ti.dataset.k="trait";tc.appendChild(ti);row.appendChild(tc);
      S.attrs.forEach(function(a){
        var td=el("td","c");var vi=el("input","n");vi.type="number";vi.min="1";vi.max="10";
        vi.value=(m.vals[a.id]===undefined?"":m.vals[a.id]);vi.dataset.mid=m.id;vi.dataset.k="val";vi.dataset.aid=a.id;
        td.appendChild(vi);row.appendChild(td);
      });
      var dc=el("td","c");if(S.microbes.length>1){var d=el("button","x","&times;");d.dataset.delrow=m.id;d.title="remove";dc.appendChild(d);}row.appendChild(dc);
      tb.appendChild(row);
    });
  }

  /* ----- render target ----- */
  function renderTarget(){
    var w=$("#rng");w.innerHTML="";
    S.attrs.forEach(function(a){
      var r=S.ranges[a.id]||(S.ranges[a.id]={min:"",max:""});
      var f=el("div","f");
      f.appendChild(el("b",null,esc(a.name)||"&mdash;"));
      var lo=el("input","n");lo.type="number";lo.value=r.min;lo.placeholder="min";lo.dataset.aid=a.id;lo.dataset.b="min";lo.setAttribute("aria-label",a.name+" min");
      var hi=el("input","n");hi.type="number";hi.value=r.max;hi.placeholder="max";hi.dataset.aid=a.id;hi.dataset.b="max";hi.setAttribute("aria-label",a.name+" max");
      f.appendChild(lo);f.appendChild(el("span",null,"&ndash;"));f.appendChild(hi);
      w.appendChild(f);
    });
    var tr=traits();
    ["des","und"].forEach(function(k){
      var s=$("#"+k),cur=S[k];s.innerHTML="";s.appendChild(new Option("— none —",""));
      tr.forEach(function(t){s.appendChild(new Option(t,t));});
      if(cur&&tr.map(norm).indexOf(norm(cur))<0)s.appendChild(new Option(cur+" (n/a)",cur));
      s.value=cur||"";
    });
    $("#pick").value=S.pick;
  }

  /* ----- solve ----- */
  function combos(n,k){var res=[],idx=[];if(k>n||k<=0)return res;for(var i=0;i<k;i++)idx.push(i);
    while(true){res.push(idx.slice());var i=k-1;while(i>=0&&idx[i]===i+n-k)i--;if(i<0)break;idx[i]++;for(var j=i+1;j<k;j++)idx[j]=idx[j-1]+1;}return res;}

  function solve(){
    var k=Math.max(1,Math.min(6,parseInt(S.pick,10)||3));
    var pool=S.microbes.map(function(m){var v={};S.attrs.forEach(function(a){var x=parseFloat(m.vals[a.id]);v[a.id]=isNaN(x)?null:x;});
      return {name:m.name||"(unnamed)",trait:m.trait||"",vals:v};})
      .filter(function(m){return (m.name&&m.name!=="(unnamed)")||S.attrs.some(function(a){return m.vals[a.id]!==null;});});
    var act=S.attrs.filter(function(a){var r=S.ranges[a.id];return r&&r.min!==""&&r.max!==""&&r.min!=null&&r.max!=null;});
    var des=S.des,und=S.und;
    var cs=combos(pool.length,k),scored=[],perfect=0;
    cs.forEach(function(c){
      var mem=c.map(function(i){return pool[i];}),viol=0,ares=[],margin=Infinity;
      act.forEach(function(a){var sum=0,ok=true;mem.forEach(function(x){if(x.vals[a.id]===null)ok=false;else sum+=x.vals[a.id];});
        var avg=sum/k,lo=parseFloat(S.ranges[a.id].min),hi=parseFloat(S.ranges[a.id].max);
        var inr=ok&&avg>=lo-1e-9&&avg<=hi+1e-9;if(!inr)viol++;else margin=Math.min(margin,Math.min(avg-lo,hi-avg));
        ares.push({name:a.name,avg:avg,lo:lo,hi:hi,in:inr,ok:ok});});
      var dC=!!des,hasD=dC?mem.some(function(x){return norm(x.trait)===norm(des);}):true;if(dC&&!hasD)viol++;
      var uC=!!und,hasU=uC?mem.some(function(x){return norm(x.trait)===norm(und);}):false;if(uC&&hasU)viol++;
      var eff=Math.max(0,100-20*viol);if(viol===0)perfect++;
      scored.push({mem:mem,eff:eff,ares:ares,dC:dC,hasD:hasD,uC:uC,hasU:hasU,margin:margin===Infinity?0:margin});
    });
    scored.sort(function(a,b){return b.eff-a.eff||b.margin-a.margin;});
    return {scored:scored,total:cs.length,perfect:perfect,des:des,und:und};
  }

  function hue(e){return e>=100?"var(--good)":(e>=60?"var(--warn)":"var(--bad)");}
  function renderOut(){
    var R=solve();
    var st=$("#status");
    if(R.total===0)st.innerHTML="Add microbes and set ranges.";
    else if(R.perfect>0)st.innerHTML="<span class='ok'>"+R.perfect+" perfect</span> of "+R.total+" combinations.";
    else st.innerHTML="<span class='no'>No 100% match</span> in "+R.total+" combinations — closest below.";

    var out=$("#out");out.innerHTML="";
    if(R.total===0){out.appendChild(el("div","empty","—"));return;}
    var show=Math.min(R.scored.length,6);
    for(var i=0;i<show;i++){
      var s=R.scored[i],card=el("div","sol"+(i===0&&s.eff===100?" best":""));
      var hd=el("div","hd");hd.appendChild(el("span","rank","#"+(i+1)));
      var p=el("span","pct",s.eff+"%");p.style.color=hue(s.eff);hd.appendChild(p);card.appendChild(hd);
      var nm=el("div","names");
      s.mem.forEach(function(x){var c="nm";if(R.des&&norm(x.trait)===norm(R.des))c+=" g";if(R.und&&norm(x.trait)===norm(R.und))c+=" b";
        nm.appendChild(el("span",c,esc(x.name)+(x.trait?"<small>"+esc(x.trait)+"</small>":"")));});
      card.appendChild(nm);
      var ch=el("div","checks");
      s.ares.forEach(function(a){ch.appendChild(el("span",null,"<span class='"+(a.in?"ck":"cx")+"'>"+(a.in?"✓":"✕")+"</span> "+esc(a.name)+" <span class='v'>"+(a.ok?fmt(a.avg):"—")+"</span> <small style='color:var(--soft)'>("+a.lo+"–"+a.hi+")</small>"));});
      if(s.dC)ch.appendChild(el("span",null,"<span class='"+(s.hasD?"ck":"cx")+"'>"+(s.hasD?"✓":"✕")+"</span> "+esc(R.des)));
      if(s.uC)ch.appendChild(el("span",null,"<span class='"+(!s.hasU?"ck":"cx")+"'>"+(!s.hasU?"✓":"✕")+"</span> no "+esc(R.und)));
      card.appendChild(ch);
      out.appendChild(card);
    }
  }

  function renderAll(){renderTarget();renderTable();renderOut();}
  var t=null;function later(){clearTimeout(t);t=setTimeout(function(){renderOut();save();},110);}

  document.addEventListener("input",function(e){var d=e.target.dataset;if(!d)return;
    if(d.k==="aname"){var a=find(S.attrs,d.aid);if(a){a.name=e.target.value;renderTarget();later();}return;}
    if(d.mid){var m=find(S.microbes,d.mid);if(!m)return;
      if(d.k==="name")m.name=e.target.value;
      else if(d.k==="trait"){m.trait=e.target.value;renderTarget();}
      else if(d.k==="val")m.vals[d.aid]=e.target.value;
      later();return;}
    if(d.b){var r=S.ranges[d.aid]||(S.ranges[d.aid]={min:"",max:""});r[d.b]=e.target.value;later();}
  });
  document.addEventListener("change",function(e){
    if(e.target.id==="des"){S.des=e.target.value;later();}
    else if(e.target.id==="und"){S.und=e.target.value;later();}
    else if(e.target.id==="pick"){S.pick=Math.max(1,Math.min(6,parseInt(e.target.value,10)||3));e.target.value=S.pick;later();}
  });
  document.addEventListener("click",function(e){var d=e.target.dataset;
    if(e.target.id==="addRow"){var o={id:gid(),name:"",trait:"",vals:{}};S.attrs.forEach(function(a){o.vals[a.id]="";});S.microbes.push(o);renderAll();save();}
    else if(e.target.id==="addCol"){var a={id:gid(),name:"Attr"+(S.attrs.length+1)};S.attrs.push(a);S.ranges[a.id]={min:"",max:""};S.microbes.forEach(function(m){m.vals[a.id]="";});renderAll();save();}
    else if(d&&d.delrow){S.microbes=S.microbes.filter(function(m){return m.id!==d.delrow;});renderAll();save();}
    else if(d&&d.delcol){S.attrs=S.attrs.filter(function(a){return a.id!==d.delcol;});delete S.ranges[d.delcol];renderAll();save();}
    else if(e.target.id==="clear"){S=blank();renderAll();save();}
  });

  renderAll();
})();
</script>
</body>
</html>
